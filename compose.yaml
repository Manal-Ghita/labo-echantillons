services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?D?finir POSTGRES_PASSWORD dans le fichier .env racine}
      POSTGRES_DB: labo_echantillons
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: