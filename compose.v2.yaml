name: labo-echantillons-v2

services:
  db-v2:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labo_v2
      POSTGRES_DB: labo_echantillons_v2
      POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD:?Configurer .env.v2}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labo_v2 -d labo_echantillons_v2"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate-v2:
    build:
      context: ./backend
      target: migration-v2
    restart: "no"
    environment:
      V2_POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD:?Configurer .env.v2}
    depends_on:
      db-v2:
        condition: service_healthy

  backend-v2:
    build:
      context: ./backend
      target: runtime-v2
    restart: unless-stopped
    init: true
    environment:
      V2_POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD:?Configurer .env.v2}
      JWT_SECRET: ${V2_JWT_SECRET:?Configurer .env.v2}
      WEB_ORIGIN: http://localhost:8180
      PORT: "3000"
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db-v2:
        condition: service_healthy
      migrate-v2:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend-v2:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3100
    restart: unless-stopped
    ports:
      - "127.0.0.1:8180:80"
    depends_on:
      backend-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_v2:
    name: labo-echantillons-v2_postgres_data
